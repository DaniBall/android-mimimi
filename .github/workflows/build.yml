name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk mimimi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mimimi-apk
          path: mimimi.apk
      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mimimi (última versión)
          body: Descarga `mimimi.apk` e instálalo en tu Android. Ver GUIA.md.
          prerelease: false
          make_latest: true
          files: mimimi.apk
